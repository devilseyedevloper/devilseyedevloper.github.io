<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff3f4"/><rect x="58" y="42" width="1084" height="616" rx="18" fill="#fff"/><text x="98" y="105" fill="#7f1d3d" font-family="Georgia" font-size="30" font-weight="700">The Gathered Day</text><text x="98" y="220" fill="#7f1d3d" font-family="Georgia" font-size="45">The planning is part of the story.</text><text x="98" y="270" fill="#9f6b7d" font-family="Arial" font-size="19">We help couples make space for the choices, people, and details that make a day theirs.</text><rect x="98" y="340" width="300" height="150" rx="12" fill="#f5d9dd"/><text x="128" y="390" fill="#7f1d3d" font-family="Arial" font-size="20" font-weight="700">Our philosophy</text><text x="128" y="430" fill="#9f6b7d" font-family="Arial" font-size="17">Less pressure. More meaning.</text><rect x="432" y="340" width="300" height="150" rx="12" fill="#e4e8d1"/><text x="462" y="390" fill="#52603f" font-family="Arial" font-size="20" font-weight="700">Our guides</text><text x="462" y="430" fill="#7b8462" font-family="Arial" font-size="17">Helpful from first list to last dance.</text></svg>