<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#24113a"/><rect x="55" y="42" width="1090" height="616" rx="18" fill="#3b1d5a"/><text x="96" y="105" fill="#fef3c7" font-family="Arial" font-size="29" font-weight="800">PULSE / LIVE</text><text x="96" y="220" fill="#fff" font-family="Arial" font-size="44" font-weight="800">Live music brings us closer.</text><text x="96" y="270" fill="#e9d5ff" font-family="Arial" font-size="19">Pulse makes it easier to find the artists, rooms, and nights worth remembering.</text><rect x="96" y="340" width="300" height="150" rx="12" fill="#f97316"/><text x="126" y="390" fill="#24113a" font-family="Arial" font-size="20" font-weight="700">Our mission</text><text x="126" y="430" fill="#fff7ed" font-family="Arial" font-size="17">More people in the room.</text><rect x="430" y="340" width="300" height="150" rx="12" fill="#e9d5ff"/><text x="460" y="390" fill="#24113a" font-family="Arial" font-size="20" font-weight="700">Our promise</text><text x="460" y="430" fill="#7c3aed" font-family="Arial" font-size="17">Good nights, made simple.</text></svg>