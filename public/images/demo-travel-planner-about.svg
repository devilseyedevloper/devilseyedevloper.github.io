<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#d8f3f4"/><rect x="55" y="42" width="1090" height="616" rx="18" fill="#fff"/><rect x="55" y="42" width="1090" height="72" rx="18" fill="#073b4c"/><text x="98" y="89" fill="#fff" font-family="Arial" font-size="27" font-weight="800">Roamly</text><text x="98" y="220" fill="#073b4c" font-family="Georgia" font-size="45">Travel is better when it feels yours.</text><text x="98" y="270" fill="#5d8188" font-family="Arial" font-size="19">Roamly helps curious people plan trips with more freedom and less tab-switching.</text><rect x="98" y="340" width="300" height="150" rx="12" fill="#83c5be"/><text x="128" y="390" fill="#073b4c" font-family="Arial" font-size="20" font-weight="700">Our point of view</text><text x="128" y="430" fill="#245f68" font-family="Arial" font-size="17">Follow curiosity, not crowds.</text><rect x="432" y="340" width="300" height="150" rx="12" fill="#ffd166"/><text x="462" y="390" fill="#073b4c" font-family="Arial" font-size="20" font-weight="700">Our guides</text><text x="462" y="430" fill="#245f68" font-family="Arial" font-size="17">Real places, useful details.</text></svg>