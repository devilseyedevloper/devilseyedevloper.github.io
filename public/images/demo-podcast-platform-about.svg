<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#161616"/><rect x="50" y="40" width="1100" height="620" rx="20" fill="#232323"/><text x="92" y="102" fill="#fb7185" font-family="Arial" font-size="28" font-weight="800">earshot</text><text x="92" y="220" fill="#fff" font-family="Arial" font-size="45" font-weight="800">Listen closer.</text><text x="92" y="270" fill="#d4d4d4" font-family="Arial" font-size="19">Earshot is a home for curious listeners and the voices that keep them company.</text><rect x="92" y="340" width="300" height="150" rx="12" fill="#be123c"/><text x="122" y="390" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Our editorial eye</text><text x="122" y="430" fill="#fecdd3" font-family="Arial" font-size="17">Stories with something to say.</text><rect x="426" y="340" width="300" height="150" rx="12" fill="#7c3aed"/><text x="456" y="390" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Our promise</text><text x="456" y="430" fill="#ede9fe" font-family="Arial" font-size="17">More depth in every listen.</text></svg>