<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#efece6"/><rect x="55" y="42" width="1090" height="616" rx="16" fill="#f9f8f5"/><text x="96" y="104" fill="#191919" font-family="Arial" font-size="28" font-weight="800">FORM / Studio</text><text x="96" y="220" fill="#191919" font-family="Arial" font-size="45" font-weight="800">We make ideas visible.</text><text x="96" y="270" fill="#656565" font-family="Arial" font-size="19">FORM is an independent studio for brand systems, digital products, and useful clarity.</text><rect x="96" y="340" width="300" height="150" rx="12" fill="#191919"/><text x="126" y="390" fill="#fff" font-family="Arial" font-size="20" font-weight="700">What we believe</text><text x="126" y="430" fill="#d6d3d1" font-family="Arial" font-size="17">Simple can be distinctive.</text><rect x="430" y="340" width="300" height="150" rx="12" fill="#ef4444"/><text x="460" y="390" fill="#fff" font-family="Arial" font-size="20" font-weight="700">How we work</text><text x="460" y="430" fill="#fee2e2" font-family="Arial" font-size="17">Think clearly. Make boldly.</text></svg>