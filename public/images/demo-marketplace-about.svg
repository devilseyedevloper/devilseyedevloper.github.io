<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f5f1ea"/><rect x="54" y="40" width="1092" height="620" rx="18" fill="#fffdf9"/><text x="95" y="102" fill="#24423a" font-family="Georgia" font-size="29" font-weight="700">Morrow Market</text><text x="95" y="220" fill="#24423a" font-family="Georgia" font-size="45">Made by people, chosen by you.</text><text x="95" y="270" fill="#6b7b71" font-family="Arial" font-size="19">Morrow connects independent makers with customers who care how things are made.</text><rect x="95" y="340" width="300" height="150" rx="12" fill="#d7e5d7"/><text x="125" y="390" fill="#24423a" font-family="Arial" font-size="20" font-weight="700">Meet the maker</text><text x="125" y="430" fill="#527060" font-family="Arial" font-size="17">Every object has a person behind it.</text><rect x="429" y="340" width="300" height="150" rx="12" fill="#e8c5a6"/><text x="459" y="390" fill="#24423a" font-family="Arial" font-size="20" font-weight="700">Shop with intent</text><text x="459" y="430" fill="#705c52" font-family="Arial" font-size="17">Fewer things. Better things.</text></svg>