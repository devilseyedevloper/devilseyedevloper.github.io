<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#e8e6df"/><rect x="64" y="45" width="1072" height="610" rx="16" fill="#f8f7f2"/><text x="104" y="106" fill="#1f3c38" font-family="Georgia" font-size="28" font-weight="700">Northline Properties</text><text x="104" y="220" fill="#1f3c38" font-family="Georgia" font-size="43">Property is personal.</text><text x="104" y="272" fill="#5c6c67" font-family="Arial" font-size="19">Northline helps people move with local knowledge, clear advice, and less noise.</text><rect x="104" y="340" width="300" height="150" rx="12" fill="#dce2dd"/><text x="134" y="390" fill="#1f3c38" font-family="Arial" font-size="20" font-weight="700">Local knowledge</text><text x="134" y="430" fill="#5c6c67" font-family="Arial" font-size="17">People who know the streets.</text><rect x="438" y="340" width="300" height="150" rx="12" fill="#b6c6bf"/><text x="468" y="390" fill="#1f3c38" font-family="Arial" font-size="20" font-weight="700">Clear guidance</text><text x="468" y="430" fill="#5c6c67" font-family="Arial" font-size="17">A better way to decide.</text></svg>