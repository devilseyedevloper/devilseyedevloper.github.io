<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#071b17"/><rect x="50" y="40" width="1100" height="620" rx="20" fill="#102b25"/><text x="92" y="103" fill="#a7f3d0" font-family="Arial" font-size="28" font-weight="800">Pennywise</text><text x="92" y="220" fill="#fff" font-family="Arial" font-size="45" font-weight="700">A calmer way to understand money.</text><text x="92" y="270" fill="#9dc3b2" font-family="Arial" font-size="19">Pennywise turns daily spending into clear, useful decisions without judgment.</text><rect x="92" y="340" width="300" height="150" rx="12" fill="#17483b"/><text x="122" y="390" fill="#a7f3d0" font-family="Arial" font-size="20" font-weight="700">Clarity first</text><text x="122" y="430" fill="#9dc3b2" font-family="Arial" font-size="17">See where your money goes.</text><rect x="426" y="340" width="300" height="150" rx="12" fill="#f0fdf4"/><text x="456" y="390" fill="#14532d" font-family="Arial" font-size="20" font-weight="700">Progress always</text><text x="456" y="430" fill="#527060" font-family="Arial" font-size="17">Build habits that last.</text></svg>