<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f2f7f4"/><rect x="54" y="40" width="1092" height="620" rx="18" fill="#fff"/><text x="96" y="104" fill="#14532d" font-family="Arial" font-size="27" font-weight="800">Common Ground</text><text x="96" y="220" fill="#14532d" font-family="Arial" font-size="45" font-weight="800">Community is a verb.</text><text x="96" y="270" fill="#527060" font-family="Arial" font-size="19">Common Ground supports practical local action through food, learning, and care.</text><rect x="96" y="340" width="300" height="150" rx="12" fill="#bbf7d0"/><text x="126" y="390" fill="#14532d" font-family="Arial" font-size="20" font-weight="700">What we do</text><text x="126" y="430" fill="#527060" font-family="Arial" font-size="17">Turn good intentions into action.</text><rect x="430" y="340" width="300" height="150" rx="12" fill="#dcfce7"/><text x="460" y="390" fill="#14532d" font-family="Arial" font-size="20" font-weight="700">How we work</text><text x="460" y="430" fill="#527060" font-family="Arial" font-size="17">Listen locally. Build together.</text></svg>