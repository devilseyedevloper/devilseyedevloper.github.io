<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8efe6"/><rect x="70" y="50" width="1060" height="600" rx="18" fill="#fff8ef"/><text x="112" y="108" fill="#3a1f17" font-family="Georgia" font-size="28" font-weight="700">Basil &amp; Brick</text><text x="112" y="220" fill="#3a1f17" font-family="Georgia" font-size="44" font-weight="700">Food made for gathering.</text><text x="112" y="270" fill="#8a6a5c" font-family="Arial" font-size="19">We cook seasonal plates, pour generous glasses, and make space for long evenings.</text><rect x="112" y="330" width="280" height="160" rx="12" fill="#f4c46b"/><text x="142" y="380" fill="#3a1f17" font-family="Arial" font-size="20" font-weight="700">Our kitchen</text><text x="142" y="420" fill="#705c52" font-family="Arial" font-size="17">Local ingredients.</text><text x="142" y="450" fill="#705c52" font-family="Arial" font-size="17">Open-hearted cooking.</text><rect x="430" y="330" width="280" height="160" rx="12" fill="#e6b27b"/><text x="460" y="380" fill="#3a1f17" font-family="Arial" font-size="20" font-weight="700">Our table</text><text x="460" y="420" fill="#705c52" font-family="Arial" font-size="17">Come as you are.</text></svg>