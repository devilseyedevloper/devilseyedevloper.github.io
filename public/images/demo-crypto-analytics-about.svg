<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#0f172a"/><rect x="50" y="40" width="1100" height="620" rx="18" fill="#18243b"/><text x="94" y="103" fill="#67e8f9" font-family="Arial" font-size="28" font-weight="800">Orbit Analytics</text><text x="94" y="220" fill="#e2e8f0" font-family="Arial" font-size="45" font-weight="700">Data should make decisions clearer.</text><text x="94" y="270" fill="#94a3b8" font-family="Arial" font-size="19">Orbit turns noisy market movement into focused context for thoughtful operators.</text><rect x="94" y="340" width="300" height="150" rx="12" fill="#101a2d"/><text x="124" y="390" fill="#67e8f9" font-family="Arial" font-size="20" font-weight="700">Our approach</text><text x="124" y="430" fill="#94a3b8" font-family="Arial" font-size="17">Context over reaction.</text><rect x="428" y="340" width="300" height="150" rx="12" fill="#0e7490"/><text x="458" y="390" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Our promise</text><text x="458" y="430" fill="#cffafe" font-family="Arial" font-size="17">Better questions, not more noise.</text></svg>