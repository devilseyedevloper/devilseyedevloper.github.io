<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html"><span class="logo-mark">GS</span><span class="logo-label">Portfolio</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="features.html">Features</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="page admin-login">
    <div class="admin-panel">
      <h1>Admin Login</h1>
      <p>Use your credentials to access contact submissions.</p>
      <form id="adminLoginForm">
        <label>Username<input name="username" type="text" required placeholder="Username"></label>
        <label>Password<input name="password" type="password" required placeholder="Password"></label>
        <div class="form-actions">
          <button class="btn" type="submit">Sign In</button>
        </div>
      </form>
      <div id="adminStatus"></div>
    </div>

    <div id="adminDashboard" class="admin-dashboard" style="display:none;">
      <div class="admin-panel">
        <h1>Contact Records</h1>
        <p>Review and delete saved client inquiries below.</p>
        <div class="admin-actions">
          <button id="logoutBtn" class="btn ghost">Sign Out</button>
        </div>
        <div id="dashboardStatus"></div>
        <table class="contact-table">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Message</th><th>Time</th><th>Action</th></tr>
          </thead>
          <tbody id="contactRows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer small">
    <div>Portfolio site admin access</div>
    <div><a class="btn small ghost" href="index.html">Back to Home</a></div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
